<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Repository 6: The race between man and machine</title>
  <desc id="desc">A unit interval of tasks is split at the automation threshold into capital and labor tasks. Automation moves the threshold right while new tasks expand the labor region.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#173b54"/>
    </linearGradient>
  </defs>
  <rect width="960" height="240" rx="18" fill="url(#background)"/>
  <text x="36" y="49" fill="#8fe3da" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">REPOSITORY 6  ·  ACEMOGLU &amp; RESTREPO</text>
  <text x="36" y="95" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">The race between man and machine</text>
  <text x="36" y="124" fill="#c9dce8" font-family="Arial, sans-serif" font-size="17">Tasks, displacement, reinstatement, and wages</text>
  <rect x="58" y="163" width="474" height="28" rx="5" fill="#4b93c5"/>
  <rect x="532" y="163" width="366" height="28" rx="5" fill="#35b7a8"/>
  <line x1="532" y1="145" x2="532" y2="200" stroke="#ffffff" stroke-width="3"/>
  <text x="232" y="183" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">CAPITAL TASKS</text>
  <text x="657" y="183" fill="#07333a" font-family="Arial, sans-serif" font-size="15" font-weight="700">LABOR TASKS</text>
  <text x="58" y="218" fill="#c9dce8" font-family="Arial, sans-serif" font-size="15">N − 1</text>
  <text x="517" y="218" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">I*</text>
  <text x="886" y="218" fill="#c9dce8" font-family="Arial, sans-serif" font-size="15">N</text>
</svg>
